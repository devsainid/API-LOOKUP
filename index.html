<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEV OSINT TERMINAL - PRO</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Courier New", Courier, monospace; }
        body {
            background-color: #020a14;
            background-image: linear-gradient(rgba(0, 229, 255, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 255, 0.08) 1px, transparent 1px);
            background-size: 25px 25px; color: #00e5ff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;
        }
        .card {
            background: rgba(0, 15, 35, 0.7); backdrop-filter: blur(10px); width: 100%; max-width: 480px;
            padding: 30px 20px; border-radius: 8px; border: 1px solid rgba(0, 229, 255, 0.4);
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.15), inset 0 0 15px rgba(0, 229, 255, 0.1);
        }
        h2 { text-align: center; margin-bottom: 25px; font-size: 22px; text-shadow: 0 0 10px #00e5ff; letter-spacing: 2px; }
        
        .input-group { display: flex; flex-direction: column; gap: 15px; }
        input {
            width: 100%; padding: 14px; font-size: 16px; background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 229, 255, 0.5); color: #00e5ff; outline: none;
            font-weight: bold; text-align: center; border-radius: 5px; transition: 0.3s;
        }
        input:focus { box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); background: rgba(0, 20, 45, 0.8); border: 1px solid #00e5ff; }
        
        button {
            width: 100%; padding: 14px; font-size: 16px; background: rgba(0, 229, 255, 0.15);
            color: #00e5ff; border: 1px solid #00e5ff; font-weight: bold; cursor: pointer;
            letter-spacing: 1.5px; transition: 0.3s; border-radius: 5px; text-shadow: 0 0 5px rgba(0, 229, 255, 0.8);
        }
        button:active { transform: scale(0.96); background: #00e5ff; color: #000; }
        
        .btn-admin { background: rgba(255, 51, 51, 0.15); color: #ff3333; border: 1px solid #ff3333; text-shadow: 0 0 5px rgba(255, 51, 51, 0.8); }
        .btn-admin:active { background: #ff3333; color: #000; }

        .hidden { display: none !important; }
        .error-msg { color: #ff3333; text-align: center; margin-top: 10px; font-weight: bold; display: none; }
        .success-msg { color: #00ff00; text-align: center; margin-top: 10px; font-weight: bold; display: none; }
        
        .admin-panel, .osint-panel { display: none; }
        .data-card { background: rgba(0, 25, 50, 0.3); border-left: 3px solid #00e5ff; padding: 15px; margin-top: 15px; border-radius: 5px; border-top: 1px solid rgba(0, 229, 255, 0.1); }
        
        .tab-container { display: flex; justify-content: space-between; margin-bottom: 25px; border-bottom: 1px solid rgba(0, 229, 255, 0.2); padding-bottom: 10px; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: bold; color: rgba(0, 229, 255, 0.4); transition: 0.3s; font-size: 14px; }
        .tab.active { color: #ffffff; text-shadow: 0 0 10px #00e5ff; border-bottom: 2px solid #00e5ff; }
        
        .user-list-item { border-bottom: 1px dashed rgba(255, 51, 51, 0.4); padding: 10px 0; font-size: 14px; color: #fff;}
        .user-list-item span { color: #ff3333; font-weight: bold;}
    </style>
</head>
<body>

<div class="card" id="mainCard">
    <!-- 1. LOGIN SCREEN -->
    <div id="loginScreen">
        <h2>[ SYSTEM AUTHORIZATION ]</h2>
        <div class="input-group">
            <input type="text" id="tokenInput" placeholder="ENTER SECURE TOKEN" autocomplete="off" />
            <button id="loginBtn" onclick="checkLogin()">AUTHENTICATE</button>
            <div class="error-msg" id="loginError">ACCESS DENIED: INVALID TOKEN</div>
            <div style="font-size:11px; text-align:center; color:gray; margin-top:10px;">
                Master Token: DEV-MASTER-777
            </div>
        </div>
    </div>

    <!-- 2. SUPER ADMIN DASHBOARD -->
    <div id="adminScreen" class="admin-panel">
        <h2 style="color: #ff3333; text-shadow: 0 0 10px #ff3333;">[ SUPER ADMIN MODE ]</h2>
        
        <div class="tab-container">
            <div class="tab active" style="color: #ff3333; border-color: #ff3333;" onclick="switchAdminTab('new')">NEW USER</div>
            <div class="tab" style="color: #ff3333;" onclick="switchAdminTab('list')">USER LIST</div>
            <div class="tab" style="color: #00e5ff;" onclick="showOSINT()">OSINT TOOL</div>
        </div>

        <!-- Create User Tab -->
        <div id="adminNewUser" class="input-group">
            <input type="text" id="newUserToken" placeholder="GENERATE NEW TOKEN (e.g. VIP-001)" />
            <button id="registerBtn" class="btn-admin" onclick="registerNewUser()">REGISTER USER TO DATABASE</button>
            <div class="success-msg" id="registerSuccess">TOKEN SAVED TO CLOUD!</div>
            <div class="error-msg" id="registerError">TOKEN ALREADY EXISTS!</div>
        </div>

        <!-- User List Tab -->
        <div id="adminUserList" class="hidden">
            <button class="btn-admin" onclick="fetchUsersList()" style="margin-bottom: 15px; font-size: 14px; padding: 10px;">🔄 REFRESH DATABASE</button>
            <div class="data-card" style="border-left-color: #ff3333;" id="usersListContainer">
                <div style="color:#ff3333; margin-bottom:10px; text-align:center;">> LOADING CLOUD DATABASE...</div>
            </div>
        </div>
    </div>

    <!-- 3. NORMAL OSINT TOOL (For Admin & Valid Users) -->
    <div id="osintScreen" class="osint-panel">
        <h2>[ OSINT TOOLKIT ]</h2>
        <div class="input-group">
            <input type="text" id="phoneInput" placeholder="TARGET NUMBER (10 DIGITS)..." autocomplete="off" />
            <button id="searchBtn" onclick="initiateSearch()">CHECK NUMBER</button>
        </div>
        <div id="result-container" style="display:none; margin-top:20px;"></div>
    </div>
</div>

<script>
    // TERA FIREBASE DATABASE URL
    const FIREBASE_URL = "https://devsainiosint-default-rtdb.firebaseio.com";
    const MASTER_TOKEN = "DEV-MASTER-777"; 

    // --- 1. LOGIN LOGIC (Checks with Firebase) ---
    async function checkLogin() {
        const token = document.getElementById('tokenInput').value.trim();
        const err = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');
        
        if (!token) return;

        // Agar Admin Hai Toh:
        if (token === MASTER_TOKEN) {
            err.style.display = "none";
            document.getElementById('loginScreen').style.display = "none";
            document.getElementById('adminScreen').style.display = "block";
            return;
        }

        // Agar Normal User Hai Toh Firebase Mein Check Karo:
        loginBtn.innerText = "VERIFYING TOKEN...";
        try {
            const response = await fetch(`${FIREBASE_URL}/users/${token}.json`);
            const data = await response.json();

            if (data !== null) {
                // TOKEN MIL GAYA! (Baad mein yahan Device ID lock ka check add karenge)
                err.style.display = "none";
                document.getElementById('loginScreen').style.display = "none";
                document.getElementById('osintScreen').style.display = "block";
            } else {
                // TOKEN NAHI MILA
                err.style.display = "block";
            }
        } catch (e) {
            err.innerText = "SYSTEM ERROR: SERVER OFFLINE";
            err.style.display = "block";
        } finally {
            loginBtn.innerText = "AUTHENTICATE";
        }
    }

    // --- 2. ADMIN: CREATE NEW USER ---
    async function registerNewUser() {
        const newToken = document.getElementById('newUserToken').value.trim();
        const regBtn = document.getElementById('registerBtn');
        const sucMsg = document.getElementById('registerSuccess');
        const errMsg = document.getElementById('registerError');

        if (!newToken) return;

        regBtn.innerText = "SAVING...";
        sucMsg.style.display = "none"; errMsg.style.display = "none";

        try {
            // Pehle check karo ki token pehle se toh nahi hai
            const checkRes = await fetch(`${FIREBASE_URL}/users/${newToken}.json`);
            const checkData = await checkRes.json();

            if (checkData !== null) {
                errMsg.style.display = "block"; // Token pehle se hai
            } else {
                // Naya Token Database mein Save Karo
                const today = new Date().toLocaleDateString('en-GB');
                const userData = {
                    createdAt: today,
                    deviceID: "unlocked", // Abhi unlocked hai
                    status: "active"
                };

                await fetch(`${FIREBASE_URL}/users/${newToken}.json`, {
                    method: 'PUT',
                    body: JSON.stringify(userData)
                });

                sucMsg.style.display = "block";
                document.getElementById('newUserToken').value = "";
            }
        } catch (e) {
            errMsg.innerText = "NETWORK ERROR";
            errMsg.style.display = "block";
        } finally {
            regBtn.innerText = "REGISTER USER TO DATABASE";
        }
    }

    // --- 3. ADMIN: FETCH USER LIST ---
    async function fetchUsersList() {
        const container = document.getElementById('usersListContainer');
        container.innerHTML = `<div style="color:#ff3333; margin-bottom:10px; text-align:center;">> FETCHING FROM CLOUD...</div>`;
        
        try {
            const response = await fetch(`${FIREBASE_URL}/users.json`);
            const data = await response.json();
            
            let html = `<div style="color:#ff3333; margin-bottom:10px; text-align:center;">> REGISTERED USERS DATABASE</div>`;
            
            if (data !== null) {
                for (const [tokenName, details] of Object.entries(data)) {
                    html += `
                    <div class="user-list-item">
                        TOKEN: <span>${tokenName}</span> <br> 
                        CREATED: ${details.createdAt} <br> 
                        DEVICE: ${details.deviceID === 'unlocked' ? '<span style="color:#00ff00;">Unlocked</span>' : 'Locked'}
                    </div>`;
                }
            } else {
                html += `<div style="text-align:center; color:#fff; font-size:14px; margin-top:15px;">NO USERS FOUND.</div>`;
            }
            container.innerHTML = html;
        } catch (e) {
            container.innerHTML = `<div style="color:#ff3333; text-align:center;">ERROR CONNECTING TO DATABASE</div>`;
        }
    }

    // --- UI TABS LOGIC ---
    function switchAdminTab(tab) {
        document.getElementById('adminNewUser').classList.add('hidden');
        document.getElementById('adminUserList').classList.add('hidden');
        if (tab === 'new') document.getElementById('adminNewUser').classList.remove('hidden');
        if (tab === 'list') { 
            document.getElementById('adminUserList').classList.remove('hidden');
            fetchUsersList(); // Tab khulte hi list auto-refresh hogi
        }
    }

    function showOSINT() {
        document.getElementById('adminScreen').style.display = "none";
        document.getElementById('osintScreen').style.display = "block";
    }

    // --- 4. OSINT PHONE SEARCH LOGIC (Purana wala intact) ---
    const API_BASE = atob("aHR0cHM6Ly9seW54Lm1pcmVpYXJpb3Nzcy53b3JrZXJzLmRldi9hcGkvc2VhcmNoLw==");
    
    async function initiateSearch() {
        const inputField = document.getElementById('phoneInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultContainer = document.getElementById('result-container');
        const mainNumber = inputField.value.trim();

        if (!mainNumber || mainNumber.length < 10) {
            alert("ACCESS DENIED: Enter Valid Target Number."); return;
        }

        resultContainer.style.display = "block";
        resultContainer.innerHTML = "<div style='text-align:center; color:#00e5ff; font-weight:bold;'>ESTABLISHING SECURE CONNECTION...</div>";
        searchBtn.disabled = true; searchBtn.innerText = "SEARCHING...";

        try {
            const response = await fetch(`${API_BASE}${encodeURIComponent(mainNumber)}`);
            const rawText = await response.text();
            const firstBrace = rawText.indexOf('{');
            const lastBrace = rawText.lastIndexOf('}');
            const jsonString = rawText.substring(firstBrace, lastBrace + 1);
            const primaryData = JSON.parse(jsonString);

            let finalHTML = "";
            if (primaryData && primaryData.results && primaryData.results.length > 0) {
                finalHTML += `<div class="data-card">`;
                for (const [key, value] of Object.entries(primaryData.results[0])) {
                    let cleanKey = key.replace(/_/g, ' '); 
                    finalHTML += `<div style="display:flex; margin-bottom:8px; border-bottom:1px dashed rgba(0,229,255,0.2);"><span style="color:#00e5ff; width:40%; font-size:13px; font-weight:bold;">${cleanKey}</span><span style="color:#fff; width:60%; font-size:14px;">${value || 'N/A'}</span></div>`;
                }
                finalHTML += `</div>`;
            } else {
                finalHTML = `<div class="data-card" style="color:#ff3333; text-align:center;">NO RECORD FOUND.</div>`;
            }
            resultContainer.innerHTML = finalHTML;
        } catch (err) {
            resultContainer.innerHTML = `<div style="color:#ff3333; text-align:center;"><strong>SYSTEM ERROR</strong></div>`;
        } finally {
            searchBtn.disabled = false; searchBtn.innerText = "CHECK NUMBER";
        }
    }
</script>
</body>
</html>
