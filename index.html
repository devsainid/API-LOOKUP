<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEV OSINT TERMINAL - PRO</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Courier New", Courier, monospace; }
        body {
            background-color: #020a14;
            background-image: linear-gradient(rgba(0, 229, 255, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 255, 0.08) 1px, transparent 1px);
            background-size: 25px 25px; color: #00e5ff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;
        }
        .card {
            background: rgba(0, 15, 35, 0.85); backdrop-filter: blur(10px); width: 100%; max-width: 480px;
            padding: 30px 20px; border-radius: 8px; border: 1px solid rgba(0, 229, 255, 0.4);
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.15), inset 0 0 15px rgba(0, 229, 255, 0.1);
        }
        
        h2 { text-align: center; margin-bottom: 20px; font-size: 18px; text-shadow: 0 0 10px #00e5ff; letter-spacing: 2px; }
        
        .input-group { display: flex; flex-direction: column; gap: 12px; }
        input {
            width: 100%; padding: 12px; font-size: 15px; background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 229, 255, 0.5); color: #00e5ff; outline: none;
            font-weight: bold; text-align: center; border-radius: 5px; transition: 0.3s;
        }
        input:focus { box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); background: rgba(0, 20, 45, 0.8); border: 1px solid #00e5ff; }
        
        button {
            width: 100%; padding: 12px; font-size: 15px; background: rgba(0, 229, 255, 0.15);
            color: #00e5ff; border: 1px solid #00e5ff; font-weight: bold; cursor: pointer;
            letter-spacing: 1px; transition: 0.3s; border-radius: 5px; text-shadow: 0 0 5px rgba(0, 229, 255, 0.8);
        }
        button:active { transform: scale(0.96); background: #00e5ff; color: #000; }
        
        .btn-admin { background: rgba(255, 51, 51, 0.15); color: #ff3333; border: 1px solid #ff3333; text-shadow: 0 0 5px rgba(255, 51, 51, 0.8); }
        .btn-admin:active { background: #ff3333; color: #000; }

        .btn-back { background: rgba(255, 255, 255, 0.1); color: #ffffff; border: 1px solid #ffffff; margin-bottom: 15px; font-size: 14px; padding: 10px; display: block; width: 100%; font-weight: bold; cursor: pointer; border-radius: 5px; text-align: center; transition: 0.3s;}
        .btn-back:active { transform: scale(0.96); }

        .btn-stop { background: rgba(255,51,51,0.2); border: 1px solid #ff3333; color: #ff3333; padding: 10px; font-size: 13px; margin-top: 15px; width: 100%; cursor: pointer; font-weight: bold; border-radius: 5px;}
        .btn-start { background: rgba(0,255,0,0.2); border: 1px solid #00ff00; color: #00ff00; padding: 10px; font-size: 13px; margin-top: 15px; width: 100%; cursor: pointer; font-weight: bold; border-radius: 5px;}

        /* Floating WhatsApp Button */
        .floating-wa {
            position: fixed; bottom: 20px; right: 20px;
            background: #25D366; color: white; width: 55px; height: 55px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.6); z-index: 9999; cursor: pointer;
            transition: 0.3s; border: 2px solid #fff;
        }
        .floating-wa:active { transform: scale(0.9); }

        .hidden { display: none !important; }
        .error-msg { color: #ff3333; text-align: center; margin-top: 8px; font-weight: bold; display: none; font-size: 13px; }
        .success-msg { color: #00ff00; text-align: center; margin-top: 8px; font-weight: bold; display: none; font-size: 13px; }
        
        .admin-panel, .osint-panel, .user-details-panel { display: none; }
        
        .tab-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; border-bottom: 1px dashed rgba(0, 229, 255, 0.3); padding-bottom: 15px; }
        .tab-admin, .tab-tool { width: 100%; padding: 12px; font-size: 15px; font-weight: bold; cursor: pointer; letter-spacing: 1px; transition: 0.3s; border-radius: 5px; text-align: center; display: block; }
        .tab-admin { background: rgba(255, 51, 51, 0.15); color: #ff3333; border: 1px solid #ff3333; text-shadow: 0 0 5px rgba(255, 51, 51, 0.8); }
        .tab-admin.active, .tab-admin:active { background: #ff3333; color: #000; text-shadow: none; }
        .tab-tool { background: rgba(0, 229, 255, 0.15); color: #00e5ff; border: 1px solid #00e5ff; text-shadow: 0 0 5px rgba(0, 229, 255, 0.8); }
        .tab-tool.active, .tab-tool:active { background: #00e5ff; color: #000; text-shadow: none; }

        .user-list-item { border-bottom: 1px dashed rgba(255, 51, 51, 0.4); padding: 12px; font-size: 13px; color: #fff; cursor: pointer; background: rgba(255,51,51,0.05); transition: 0.3s; margin-bottom: 8px; border-radius: 5px;}
        .user-list-item:hover { background: rgba(255,51,51,0.15); }
        
        .history-item { border-bottom: 1px dotted rgba(255,255,255,0.2); padding: 8px 0; font-size: 12px; color: #ddd; display: flex; justify-content: space-between; align-items: center;}
        .history-title { color: #fff; font-weight: bold; font-size: 13px; margin-top: 20px; border-bottom: 1px solid #ff3333; padding-bottom: 5px; display: flex; justify-content: space-between;}
        
        /* 🔥 NEW PRO DATA CARD UI 🔥 */
        .data-card { background: rgba(0, 15, 30, 0.9); border: 1px solid #00e5ff; margin-top: 15px; border-radius: 6px; overflow: hidden; box-shadow: 0 0 15px rgba(0, 229, 255, 0.15); }
        .record-header { background: rgba(0, 229, 255, 0.15); color: #00e5ff; padding: 10px 15px; font-weight: bold; font-size: 13px; border-bottom: 1px solid #00e5ff; display: flex; justify-content: space-between; letter-spacing: 1px; }
        .record-body { padding: 15px; }
        .data-row { display: flex; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed rgba(255, 255, 255, 0.1); align-items: flex-start; }
        .data-label { color: #00e5ff; width: 38%; font-weight: bold; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; display: flex; align-items: center; gap: 5px; }
        .data-value { color: #ffffff; width: 62%; font-size: 13px; word-break: break-word; font-family: monospace; letter-spacing: 0.5px; }

        .terminal-loader { font-family: "Courier New", Courier, monospace; color: #00ff00; font-size: 12px; text-align: left; padding: 10px; background: rgba(0,0,0,0.5); border-radius: 5px; border: 1px solid #00ff00; margin-bottom: 15px;}
    </style>
</head>
<body>

<!-- WHATSAPP SUPPORT BUTTON -->
<div class="floating-wa" onclick="openSupport()">
    <svg width="30" height="30" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.002 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
</div>

<div class="card" id="mainCard">
    <!-- 1. LOGIN SCREEN -->
    <div id="loginScreen">
        <h2>[ SYSTEM AUTHORIZATION ]</h2>
        <div class="input-group">
            <input type="text" id="tokenInput" placeholder="ENTER SECURE TOKEN" autocomplete="off" />
            <button id="loginBtn" onclick="processLogin()">VERIFY TOKEN</button>
            <div class="error-msg" id="loginError">ACCESS DENIED: INVALID TOKEN</div>
        </div>
    </div>

    <!-- 2. SUPER ADMIN DASHBOARD -->
    <div id="adminScreen" class="admin-panel">
        <h2 style="color: #ff3333; text-shadow: 0 0 10px #ff3333;">[ SUPER ADMIN DASHBOARD ]</h2>
        
        <div class="tab-container">
            <button class="tab-admin active" id="tab-new" onclick="switchAdminTab('new')">ADD NEW USER</button>
            <button class="tab-admin" id="tab-list" onclick="switchAdminTab('list')">MANAGE USERS</button>
            <button class="tab-tool" id="tab-tool" onclick="showOSINTFromAdmin()">LAUNCH OSINT TOOL</button>
        </div>

        <div id="adminNewUser" class="input-group">
            <input type="text" id="newUserToken" placeholder="CREATE SECURE TOKEN (e.g. VIP-01)" />
            <button id="registerBtn" class="btn-admin" onclick="registerNewUser()">SAVE TO DATABASE</button>
            <div class="success-msg" id="registerSuccess">TOKEN SAVED TO CLOUD!</div>
            <div class="error-msg" id="registerError">ERROR!</div>
        </div>

        <div id="adminUserList" class="hidden">
            <button class="btn-admin" onclick="fetchUsersList()" style="margin-bottom: 15px; padding: 12px;">🔄 REFRESH DATABASE</button>
            <div id="usersListContainer"></div>
        </div>
    </div>

    <!-- 2.5 ADMIN USER TRACKING PANEL -->
    <div id="userDetailsPanel" class="user-details-panel">
        <h2 style="color: #ff3333; text-shadow: 0 0 10px #ff3333;">[ USER TRACKING LOGS ]</h2>
        <button class="btn-back" onclick="backToUserList()" style="background: rgba(255, 255, 255, 0.1); border: 1px solid #fff; color:#fff;">[ < BACK TO LIST ]</button>
        <div id="userDetailsContent" class="data-card" style="border-left-color: #ff3333; padding:15px; margin-top:10px;">
            Extracting user database logs...
        </div>
    </div>

    <!-- 3. ADVANCED OSINT TOOL -->
    <div id="osintScreen" class="osint-panel">
        <h2>[ ADVANCED OSINT TOOL ]</h2>
        
        <!-- ROLE BASED BUTTON -->
        <button id="backToAdminBtn" class="btn-back"></button>
        
        <div class="input-group">
            <input type="number" id="phoneInput" placeholder="TARGET NUMBER (10 DIGITS)..." autocomplete="off" />
            <button id="searchBtn" onclick="initiateSearch()">START TRACKING</button>
        </div>
        
        <div id="result-container" style="display:none; margin-top:15px;">
            <div id="loadingStatus" class="terminal-loader" style="display:none;"></div>
            <div id="dataOutput"></div>
        </div>
    </div>
</div>

<script>
    const FIREBASE_URL = "https://devsainiosint-default-rtdb.firebaseio.com";
    const MASTER_TOKEN = "DEV-MASTER-777"; 

    function openSupport() {
        if (typeof window.AppInventor !== "undefined") {
            window.AppInventor.setWebViewString("WA_SUPPORT");
        } else {
            window.location.href = "https://wa.me/261348585420?text=I%20WANT%20TOKEN";
        }
    }

    // USER TRACKING ENGINE 
    async function logUserAction(type, dataValue) {
        const currentToken = localStorage.getItem("dev_osint_token");
        if (!currentToken || currentToken === MASTER_TOKEN) return; 
        
        const timestamp = new Date().toLocaleString('en-IN'); 
        try {
            await fetch(`${FIREBASE_URL}/users/${currentToken}/${type}.json`, {
                method: 'POST',
                body: JSON.stringify({ item: dataValue, time: timestamp })
            });
        } catch(e) {}
    }

    window.onload = function() {
        const savedToken = localStorage.getItem("dev_osint_token");
        if(savedToken) {
            document.getElementById('tokenInput').value = savedToken;
            processLogin(true);
        }
    };

    async function processLogin(isAuto = false) {
        const token = document.getElementById('tokenInput').value.trim();
        const err = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');
        if (!token) return;

        if (token === MASTER_TOKEN) {
            localStorage.setItem("dev_osint_token", token);
            err.style.display = "none";
            document.getElementById('loginScreen').style.display = "none";
            document.getElementById('adminScreen').style.display = "block";
            
            const backBtn = document.getElementById('backToAdminBtn');
            backBtn.innerText = "[ < BACK TO DASHBOARD ]";
            backBtn.onclick = goBackToAdmin;
            backBtn.style.background = "rgba(255, 255, 255, 0.1)";
            backBtn.style.color = "#ffffff";
            backBtn.style.border = "1px solid #ffffff";
            return;
        }

        if(!isAuto) loginBtn.innerText = "VERIFYING...";
        try {
            const response = await fetch(`${FIREBASE_URL}/users/${token}.json`);
            const data = await response.json();
            
            if (data !== null) {
                const status = data.status || "active";
                if (status === "active") {
                    localStorage.setItem("dev_osint_token", token);
                    err.style.display = "none";
                    document.getElementById('loginScreen').style.display = "none";
                    document.getElementById('osintScreen').style.display = "block";
                    
                    const backBtn = document.getElementById('backToAdminBtn');
                    backBtn.innerText = "[ 🔴 SECURE LOGOUT ]";
                    backBtn.onclick = function() {
                        localStorage.removeItem("dev_osint_token");
                        location.reload();
                    };
                    backBtn.style.background = "rgba(255, 51, 51, 0.15)";
                    backBtn.style.color = "#ff3333";
                    backBtn.style.border = "1px solid #ff3333";

                } else {
                    err.innerText = "ACCESS DENIED: TOKEN SUSPENDED";
                    err.style.display = "block";
                    localStorage.removeItem("dev_osint_token");
                }
            } else {
                err.innerText = "ACCESS DENIED: INVALID TOKEN";
                err.style.display = "block";
                localStorage.removeItem("dev_osint_token");
            }
        } catch (e) {
            err.innerText = "SYSTEM ERROR: SERVER OFFLINE";
            err.style.display = "block";
        } finally {
            if(!isAuto) loginBtn.innerText = "VERIFY TOKEN";
        }
    }

    function switchAdminTab(tab) {
        document.getElementById('adminNewUser').classList.add('hidden');
        document.getElementById('adminUserList').classList.add('hidden');
        document.getElementById('userDetailsPanel').style.display = "none"; 
        
        document.getElementById('tab-new').classList.remove('active');
        document.getElementById('tab-list').classList.remove('active');

        if (tab === 'new') {
            document.getElementById('adminNewUser').classList.remove('hidden');
            document.getElementById('tab-new').classList.add('active');
        }
        if (tab === 'list') { 
            document.getElementById('adminUserList').classList.remove('hidden');
            document.getElementById('tab-list').classList.add('active');
            fetchUsersList(); 
        }
    }

    function showOSINTFromAdmin() {
        document.getElementById('adminScreen').style.display = "none";
        document.getElementById('osintScreen').style.display = "block";
    }

    function goBackToAdmin() {
        document.getElementById('osintScreen').style.display = "none";
        document.getElementById('adminScreen').style.display = "block";
    }

    async function registerNewUser() {
        const newToken = document.getElementById('newUserToken').value.trim();
        const regBtn = document.getElementById('registerBtn');
        const sucMsg = document.getElementById('registerSuccess');
        const errMsg = document.getElementById('registerError');
        if (!newToken) return;

        if (newToken === MASTER_TOKEN) {
            errMsg.innerText = "ERROR: CANNOT USE MASTER TOKEN NAME!";
            errMsg.style.display = "block"; return;
        }
        regBtn.innerText = "SAVING..."; sucMsg.style.display = "none"; errMsg.style.display = "none";

        try {
            const checkRes = await fetch(`${FIREBASE_URL}/users/${newToken}.json`);
            if ((await checkRes.json()) !== null) {
                errMsg.innerText = "TOKEN ALREADY EXISTS!"; errMsg.style.display = "block";
            } else {
                const today = new Date().toLocaleDateString('en-IN');
                await fetch(`${FIREBASE_URL}/users/${newToken}.json`, {
                    method: 'PUT',
                    body: JSON.stringify({ createdAt: today, deviceID: "unlocked", status: "active" })
                });
                sucMsg.style.display = "block";
                document.getElementById('newUserToken').value = "";
            }
        } catch (e) {
            errMsg.innerText = "NETWORK ERROR"; errMsg.style.display = "block";
        } finally { regBtn.innerText = "SAVE TO DATABASE"; }
    }

    async function fetchUsersList() {
        const container = document.getElementById('usersListContainer');
        container.innerHTML = `<div style="color:#ff3333; margin-bottom:10px; text-align:center;">> FETCHING CLOUD DATA...</div>`;
        try {
            const response = await fetch(`${FIREBASE_URL}/users.json`);
            const data = await response.json();
            let html = `<div style="color:#ff3333; margin-bottom:10px; text-align:center;">> REGISTERED USERS (TAP TO VIEW LOGS)</div>`;
            if (data !== null) {
                for (const [tokenName, details] of Object.entries(data)) {
                    let st = details.status || "active";
                    let statusColor = st === 'active' ? '#00ff00' : '#ff3333';
                    
                    html += `
                    <div class="user-list-item" onclick="openUserProfile('${tokenName}')">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <span style="color:#00e5ff; font-size:15px;">${tokenName}</span>
                            <span style="color:${statusColor}; font-size:11px;">[ ${st.toUpperCase()} ]</span>
                        </div>
                        <div style="margin-top:5px; font-size:11px; color:gray;">Created: ${details.createdAt || 'N/A'}</div>
                    </div>`;
                }
            } else { html += `<div style="text-align:center; color:#fff; font-size:12px;">NO USERS FOUND.</div>`; }
            container.innerHTML = html;
        } catch (e) { container.innerHTML = `<div style="color:#ff3333; text-align:center;">ERROR CONNECTING TO DATABASE</div>`; }
    }

    async function openUserProfile(tokenName) {
        document.getElementById('adminUserList').classList.add('hidden');
        document.getElementById('userDetailsPanel').style.display = "block";
        const content = document.getElementById('userDetailsContent');
        content.innerHTML = "Extracting user database logs...";

        try {
            const res = await fetch(`${FIREBASE_URL}/users/${tokenName}.json`);
            const data = await res.json();
            if(!data) return;

            let st = data.status || "active";
            let statusColor = st === 'active' ? '#00ff00' : '#ff3333';
            let btnAction = st === 'active' 
                ? `<button class="btn-stop" onclick="toggleTokenStatus('${tokenName}', 'active')">🛑 SUSPEND TOKEN ACCESS</button>` 
                : `<button class="btn-start" onclick="toggleTokenStatus('${tokenName}', 'suspended')">✅ ACTIVATE TOKEN ACCESS</button>`;

            let searchHtml = "";
            let totalSearches = 0;
            if(data.searches) {
                const searchObj = Object.values(data.searches).reverse();
                totalSearches = searchObj.length;
                searchObj.forEach(s => {
                    searchHtml += `<div class="history-item">
                        <span><span style="color:#00e5ff;">📞</span> ${s.item}</span> 
                        <span style="color:gray;">${s.time}</span>
                    </div>`;
                });
            } else { searchHtml = "<div class='history-item'>No tracking data found yet.</div>"; }

            let fullHtml = `
                <div style="font-size:16px; margin-bottom:10px;">Token: <span style="color:#00e5ff; font-weight:bold;">${tokenName}</span></div>
                <div>Status: <span style="color:${statusColor}; font-weight:bold;">${st.toUpperCase()}</span></div>
                <div>Created: ${data.createdAt || 'N/A'}</div>
                
                ${btnAction}

                <div class="history-title">
                    <span>TRACKED NUMBERS LOG</span>
                    <span style="color:#00e5ff;">Total: ${totalSearches}</span>
                </div>
                <div style="max-height:250px; overflow-y:auto; background:rgba(0,0,0,0.3); padding:8px; border-radius:3px; margin-top:10px;">
                    ${searchHtml}
                </div>
            `;
            content.innerHTML = fullHtml;

        } catch(e) { content.innerHTML = "Error loading user logs."; }
    }

    function backToUserList() {
        document.getElementById('userDetailsPanel').style.display = "none";
        document.getElementById('adminUserList').classList.remove('hidden');
        fetchUsersList(); 
    }

    async function toggleTokenStatus(tokenName, currentStatus) {
        const newStatus = (currentStatus === "active") ? "suspended" : "active";
        try {
            await fetch(`${FIREBASE_URL}/users/${tokenName}/status.json`, {
                method: 'PUT',
                body: JSON.stringify(newStatus)
            });
            openUserProfile(tokenName); 
        } catch(e) { alert("Error updating status!"); }
    }

    // --- 🔥 ADVANCED OSINT ENGINE (NO ALT NUMBERS) 🔥 ---
    const API_BASE = atob("aHR0cHM6Ly9seW54Lm1pcmVpYXJpb3Nzcy53b3JrZXJzLmRldi9hcGkvc2VhcmNoLw==");

    async function playTerminalAnimation() {
        const loader = document.getElementById('loadingStatus');
        loader.style.display = "block";
        const steps = [
            "ESTABLISHING SECURE CONNECTION...",
            "BYPASSING FIREWALLS...",
            "ACCESSING TELECOM DATABASE...",
            "EXTRACTING TARGET DATA..."
        ];
        
        loader.innerHTML = "";
        for(let i=0; i<steps.length; i++) {
            loader.innerHTML += `> ${steps[i]}<br>`;
            await new Promise(r => setTimeout(r, 200)); 
        }
        loader.innerHTML += `<span style="color:#00ff00;">> DECODING PACKETS...</span><br>`;
        await new Promise(r => setTimeout(r, 300));
        loader.style.display = "none";
        loader.innerHTML = ""; 
    }

    async function initiateSearch() {
        const inputField = document.getElementById('phoneInput');
        const searchBtn = document.getElementById('searchBtn');
        const mainNumber = inputField.value.trim();

        if (!mainNumber || mainNumber.length < 10) { alert("ACCESS DENIED: Enter Valid 10-Digit Target Number."); return; }

        const currentToken = localStorage.getItem("dev_osint_token");
        if(currentToken && currentToken !== MASTER_TOKEN) {
            try {
                const checkRes = await fetch(`${FIREBASE_URL}/users/${currentToken}/status.json`);
                const status = await checkRes.json();
                if(status && status !== "active") {
                    alert("⚠️ SESSION EXPIRED: YOUR TOKEN HAS BEEN SUSPENDED.");
                    localStorage.removeItem("dev_osint_token"); location.reload(); return;
                }
            } catch(e) {}
        }

        await logUserAction("searches", mainNumber);

        document.getElementById('result-container').style.display = "block";
        document.getElementById('dataOutput').innerHTML = ""; 
        searchBtn.disabled = true; searchBtn.innerText = "TRACKING NUMBER...";

        try {
            await playTerminalAnimation();

            let response = await fetch(`${API_BASE}${encodeURIComponent(mainNumber)}`);
            if (!response.ok) throw new Error("API FAILED");
            let rawText = await response.text();
            let primaryData = JSON.parse(rawText.substring(rawText.indexOf('{'), rawText.lastIndexOf('}') + 1));

            // ALT NUMBER LOGIC COMPLETELY REMOVED! Only displays the given primary number.
            if (primaryData && primaryData.results && primaryData.results.length > 0) {
                let finalHTML = `<div style="text-align:center; font-weight:bold; font-size:15px; margin-top:10px; margin-bottom: 5px; color:#00ff00; text-shadow: 0 0 5px #00ff00;">[ ${primaryData.results.length} RECORD(S) FOUND FOR ${mainNumber} ]</div>`;
                finalHTML += generateCardHTML(primaryData.results);
                document.getElementById('dataOutput').innerHTML = finalHTML;
            } else {
                document.getElementById('dataOutput').innerHTML = `<div class="data-card" style="color:#ff3333; text-align:center; padding: 20px; font-weight:bold;">TARGET NOT FOUND IN DATABASE.</div>`;
            }

        } catch (err) {
            document.getElementById('dataOutput').innerHTML = `<div class="data-card" style="border-left-color:#ff3333; color:#ff3333; text-align:center;">SYSTEM ERROR: UNABLE TO FETCH DATA.</div>`;
        } finally {
            searchBtn.disabled = false; searchBtn.innerText = "START TRACKING";
        }
    }

    // 🔥 NEW PREMIUM "PRO" DATA UI 🔥
    function generateCardHTML(dataArray) {
        let html = "";
        let recordCount = 1;
        
        // Remove duplicate identical records to keep it clean
        const uniqueData = dataArray.filter((v,i,a)=>a.findIndex(t=>(JSON.stringify(t) === JSON.stringify(v)))===i);

        uniqueData.forEach((item) => {
            html += `
            <div class="data-card">
                <div class="record-header">
                    <span>📁 RECORD FILE #${recordCount}</span>
                    <span style="color:#00ff00;">VERIFIED ✔</span>
                </div>
                <div class="record-body">`;
            
            for (const [key, value] of Object.entries(item)) {
                let cleanKey = key.replace(/_/g, ' '); 
                let cleanValue = value || 'N/A';
                
                let icon = "🔹";
                let valColor = "#ffffff";
                
                let k = key.toLowerCase();
                if(k.includes('name')) { icon = "👤"; valColor = "#00ff00"; }
                else if(k.includes('mobile') || k.includes('phone')) icon = "📱";
                else if(k.includes('address')) icon = "📍";
                else if(k.includes('father')) icon = "👨‍👧‍👦";
                else if(k.includes('aadhar')) icon = "🆔";
                else if(k.includes('email')) icon = "✉️";
                else if(k.includes('alternate')) { icon = "🔗"; valColor = "#ffa500"; }
                else if(k.includes('circle')) icon = "🌐";

                html += `
                    <div class="data-row">
                        <span class="data-label">${icon} ${cleanKey}</span>
                        <span class="data-value" style="color:${valColor};">${cleanValue}</span>
                    </div>`;
            }
            html += `</div></div>`;
            recordCount++;
        });
        return html;
    }
</script>
