<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEV OSINT TERMINAL - PRO</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Courier New", Courier, monospace; }
        body {
            background-color: #020a14;
            background-image: linear-gradient(rgba(0, 229, 255, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 255, 0.08) 1px, transparent 1px);
            background-size: 25px 25px; color: #00e5ff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;
        }
        .card {
            background: rgba(0, 15, 35, 0.85); backdrop-filter: blur(10px); width: 100%; max-width: 480px;
            padding: 30px 20px; border-radius: 8px; border: 1px solid rgba(0, 229, 255, 0.4);
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.15), inset 0 0 15px rgba(0, 229, 255, 0.1);
        }
        
        h2 { text-align: center; margin-bottom: 20px; font-size: 18px; text-shadow: 0 0 10px #00e5ff; letter-spacing: 2px; }
        
        .input-group { display: flex; flex-direction: column; gap: 12px; }
        input {
            width: 100%; padding: 12px; font-size: 15px; background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 229, 255, 0.5); color: #00e5ff; outline: none;
            font-weight: bold; text-align: center; border-radius: 5px; transition: 0.3s;
        }
        input:focus { box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); background: rgba(0, 20, 45, 0.8); border: 1px solid #00e5ff; }
        
        button {
            width: 100%; padding: 12px; font-size: 15px; background: rgba(0, 229, 255, 0.15);
            color: #00e5ff; border: 1px solid #00e5ff; font-weight: bold; cursor: pointer;
            letter-spacing: 1px; transition: 0.3s; border-radius: 5px; text-shadow: 0 0 5px rgba(0, 229, 255, 0.8);
        }
        button:active { transform: scale(0.96); background: #00e5ff; color: #000; }
        
        .btn-admin { background: rgba(255, 51, 51, 0.15); color: #ff3333; border: 1px solid #ff3333; text-shadow: 0 0 5px rgba(255, 51, 51, 0.8); }
        .btn-admin:active { background: #ff3333; color: #000; }

        .btn-wa { background: rgba(37, 211, 102, 0.15); color: #25D366; border: 1px solid #25D366; text-shadow: 0 0 5px rgba(37, 211, 102, 0.8); display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; font-weight: bold; padding: 12px; border-radius: 5px; margin-top: 10px; cursor: pointer; }
        .btn-wa:active { background: #25D366; color: #000; text-shadow: none; }

        .btn-ghost { background: rgba(255, 165, 0, 0.15); color: #ffa500; border: 1px solid #ffa500; text-shadow: 0 0 5px rgba(255, 165, 0, 0.8); margin-top: 5px; }
        .btn-ghost:active { background: #ffa500; color: #000; }

        .btn-back { background: rgba(255, 255, 255, 0.1); color: #ffffff; border: 1px solid #ffffff; margin-bottom: 15px; display: none; font-size: 14px; padding: 10px; }
        .btn-back:active { background: #ffffff; color: #000; }

        .btn-stop { background: rgba(255,51,51,0.2); border: 1px solid #ff3333; color: #ff3333; padding: 6px; font-size: 11px; margin-top: 8px; width: 48%; }
        .btn-start { background: rgba(0,255,0,0.2); border: 1px solid #00ff00; color: #00ff00; padding: 6px; font-size: 11px; margin-top: 8px; width: 48%; }

        .hidden { display: none !important; }
        .error-msg { color: #ff3333; text-align: center; margin-top: 8px; font-weight: bold; display: none; font-size: 13px; }
        .success-msg { color: #00ff00; text-align: center; margin-top: 8px; font-weight: bold; display: none; font-size: 13px; }
        
        .admin-panel, .osint-panel, .ghost-panel { display: none; }
        
        .data-card { background: rgba(0, 25, 50, 0.3); border-left: 3px solid #00e5ff; padding: 12px; margin-top: 12px; border-radius: 5px; border-top: 1px solid rgba(0, 229, 255, 0.1); }
        .alt-card { background: rgba(40, 10, 0, 0.3); border-left: 3px solid #ff3333; padding: 12px; margin-top: 12px; border-radius: 5px; border-top: 1px solid rgba(255, 51, 51, 0.1); }
        .data-label { color: #00e5ff; width: 40%; font-weight: bold; text-transform: uppercase; font-size: 11px; }
        .alt-card .data-label { color: #ff5555; }
        .data-value { color: #ffffff; width: 60%; font-size: 12px; word-break: break-all; }
        
        .tab-container { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; border-bottom: 1px dashed rgba(0, 229, 255, 0.3); padding-bottom: 15px; }
        .tab-admin, .tab-tool, .tab-ghost { width: 100%; padding: 12px; font-size: 15px; font-weight: bold; cursor: pointer; letter-spacing: 1px; transition: 0.3s; border-radius: 5px; text-align: center; display: block; }
        .tab-admin { background: rgba(255, 51, 51, 0.15); color: #ff3333; border: 1px solid #ff3333; text-shadow: 0 0 5px rgba(255, 51, 51, 0.8); }
        .tab-admin.active, .tab-admin:active { background: #ff3333; color: #000; text-shadow: none; }
        .tab-tool { background: rgba(0, 229, 255, 0.15); color: #00e5ff; border: 1px solid #00e5ff; text-shadow: 0 0 5px rgba(0, 229, 255, 0.8); }
        .tab-tool.active, .tab-tool:active { background: #00e5ff; color: #000; text-shadow: none; }
        .tab-ghost { background: rgba(255, 165, 0, 0.15); color: #ffa500; border: 1px solid #ffa500; text-shadow: 0 0 5px rgba(255, 165, 0, 0.8); }
        .tab-ghost.active, .tab-ghost:active { background: #ffa500; color: #000; text-shadow: none; }

        .user-list-item { border-bottom: 1px dashed rgba(255, 51, 51, 0.4); padding: 8px 0; font-size: 12px; color: #fff; position: relative;}
        .user-list-item span { font-weight: bold;}
    </style>
</head>
<body>

<div class="card" id="mainCard">
    <!-- 1. LOGIN SCREEN -->
    <div id="loginScreen">
        <h2>[ SYSTEM AUTHORIZATION ]</h2>
        <div class="input-group">
            <input type="text" id="tokenInput" placeholder="ENTER SECURE TOKEN" autocomplete="off" />
            <button id="loginBtn" onclick="processLogin()">AUTHENTICATE</button>
            <div class="error-msg" id="loginError">ACCESS DENIED: INVALID TOKEN</div>
            
            <!-- WhatsApp Bug Fixed: Simple API Link -->
            <a href="https://api.whatsapp.com/send?phone=261348585420&text=I%20WANT%20TOKEN" class="btn-wa">
                <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.002 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                CONTACT SUPPORT (GET TOKEN)
            </a>
        </div>
    </div>

    <!-- 2. SUPER ADMIN DASHBOARD -->
    <div id="adminScreen" class="admin-panel">
        <h2 style="color: #ff3333; text-shadow: 0 0 10px #ff3333;">[ SUPER ADMIN MODE ]</h2>
        
        <div class="tab-container">
            <button class="tab-admin active" id="tab-new" onclick="switchAdminTab('new')">NEW USER</button>
            <button class="tab-admin" id="tab-list" onclick="switchAdminTab('list')">USER LIST</button>
            <button class="tab-tool" id="tab-tool" onclick="showOSINTFromAdmin()">OSINT TOOL</button>
            <button class="tab-ghost" id="tab-ghost-admin" onclick="showGhostMailFromAdmin()">👻 GHOST MAIL</button>
        </div>

        <div id="adminNewUser" class="input-group">
            <input type="text" id="newUserToken" placeholder="GENERATE TOKEN (e.g. VIP-01)" />
            <button id="registerBtn" class="btn-admin" onclick="registerNewUser()">REGISTER TO DATABASE</button>
            <div class="success-msg" id="registerSuccess">TOKEN SAVED TO CLOUD!</div>
            <div class="error-msg" id="registerError">ERROR!</div>
        </div>

        <div id="adminUserList" class="hidden">
            <button class="btn-admin" onclick="fetchUsersList()" style="margin-bottom: 15px; padding: 12px;">🔄 REFRESH DATABASE</button>
            <div class="data-card" style="border-left-color: #ff3333;" id="usersListContainer">
                <div style="color:#ff3333; margin-bottom:10px; text-align:center;">> LOADING DATABASE...</div>
            </div>
        </div>
    </div>

    <!-- 3. NORMAL OSINT TOOL -->
    <div id="osintScreen" class="osint-panel">
        <h2>[ OSINT TOOLKIT ]</h2>
        <button id="backToAdminBtn" class="btn-back" onclick="goBackToAdmin()">[ < BACK TO ADMIN PANEL ]</button>
        
        <div class="input-group">
            <input type="text" id="phoneInput" placeholder="TARGET NUMBER (10 DIGITS)..." autocomplete="off" />
            <button id="searchBtn" onclick="initiateSearch()">CHECK NUMBER</button>
            <button class="btn-ghost" onclick="openGhostMailMain()">👻 OPEN GHOST MAIL (TEMP MAIL)</button>
        </div>
        
        <div id="result-container" style="display:none; margin-top:15px;">
            <div id="loadingStatus" style="text-align:center; color:#00e5ff; font-weight:bold; margin-bottom:10px;"></div>
            <div id="dataOutput"></div>
        </div>
    </div>

    <!-- 4. GHOST MAIL SCREEN -->
    <div id="ghostScreen" class="ghost-panel">
        <h2 style="color: #ffa500; text-shadow: 0 0 10px #ffa500;">[ GHOST MAIL GENERATOR ]</h2>
        <button id="backFromGhostBtn" class="btn-back" onclick="goBackFromGhost()" style="display:block;">[ < BACK ]</button>
        
        <div class="input-group">
            <div style="font-size: 12px; color: #ffa500; margin-bottom: 2px;">YOUR TEMPORARY EMAIL:</div>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="ghostEmailBox" readonly style="color: #ffa500; font-size: 13px;" placeholder="Generating..." />
                <button class="btn-ghost" style="width: 35%; margin-top:0; padding:10px; font-size:13px;" onclick="copyGhostEmail()">COPY</button>
            </div>
            <button class="btn-ghost" onclick="fetchGhostInbox()" style="margin-top: 10px;">📥 CHECK INBOX</button>
            <div class="success-msg" id="ghostCopiedMsg" style="color:#ffa500;">EMAIL COPIED TO CLIPBOARD!</div>
        </div>

        <div id="ghostInboxContainer" style="margin-top: 15px; max-height: 200px; overflow-y: auto;">
            <div class="data-card" style="border-left-color: #ffa500; text-align: center; color: #fff; font-size: 12px;">
                Inbox is empty. Click "Check Inbox" to refresh.
            </div>
        </div>
    </div>
</div>

<script>
    const FIREBASE_URL = "https://devsainiosint-default-rtdb.firebaseio.com";
    const MASTER_TOKEN = "DEV-MASTER-777"; 

    window.onload = function() {
        const savedToken = localStorage.getItem("dev_osint_token");
        if(savedToken) {
            document.getElementById('tokenInput').value = savedToken;
            processLogin(true);
        }
    };

    async function processLogin(isAuto = false) {
        const token = document.getElementById('tokenInput').value.trim();
        const err = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');
        if (!token) return;

        if (token === MASTER_TOKEN) {
            localStorage.setItem("dev_osint_token", token);
            err.style.display = "none";
            document.getElementById('loginScreen').style.display = "none";
            document.getElementById('adminScreen').style.display = "block";
            return;
        }

        if(!isAuto) loginBtn.innerText = "VERIFYING...";
        try {
            const response = await fetch(`${FIREBASE_URL}/users/${token}.json`);
            const data = await response.json();
            
            if (data !== null) {
                const status = data.status || "active";
                if (status === "active") {
                    localStorage.setItem("dev_osint_token", token);
                    err.style.display = "none";
                    document.getElementById('loginScreen').style.display = "none";
                    document.getElementById('osintScreen').style.display = "block";
                    document.getElementById('backToAdminBtn').style.display = "none"; 
                } else {
                    err.innerText = "ACCESS DENIED: TOKEN SUSPENDED";
                    err.style.display = "block";
                    localStorage.removeItem("dev_osint_token");
                }
            } else {
                err.innerText = "ACCESS DENIED: INVALID TOKEN";
                err.style.display = "block";
                localStorage.removeItem("dev_osint_token");
            }
        } catch (e) {
            err.innerText = "SYSTEM ERROR: SERVER OFFLINE";
            err.style.display = "block";
        } finally {
            if(!isAuto) loginBtn.innerText = "AUTHENTICATE";
        }
    }

    function switchAdminTab(tab) {
        document.getElementById('adminNewUser').classList.add('hidden');
        document.getElementById('adminUserList').classList.add('hidden');
        document.getElementById('tab-new').classList.remove('active');
        document.getElementById('tab-list').classList.remove('active');

        if (tab === 'new') {
            document.getElementById('adminNewUser').classList.remove('hidden');
            document.getElementById('tab-new').classList.add('active');
        }
        if (tab === 'list') { 
            document.getElementById('adminUserList').classList.remove('hidden');
            document.getElementById('tab-list').classList.add('active');
            fetchUsersList(); 
        }
    }

    function showOSINTFromAdmin() {
        document.getElementById('adminScreen').style.display = "none";
        document.getElementById('osintScreen').style.display = "block";
        document.getElementById('backToAdminBtn').style.display = "block"; 
    }

    function showGhostMailFromAdmin() {
        document.getElementById('adminScreen').style.display = "none";
        document.getElementById('ghostScreen').style.display = "block";
        document.getElementById('backFromGhostBtn').onclick = function() {
            document.getElementById('ghostScreen').style.display = "none";
            document.getElementById('adminScreen').style.display = "block";
        };
        initGhostMail();
    }

    function openGhostMailMain() {
        document.getElementById('osintScreen').style.display = "none";
        document.getElementById('ghostScreen').style.display = "block";
        document.getElementById('backFromGhostBtn').onclick = function() {
            document.getElementById('ghostScreen').style.display = "none";
            document.getElementById('osintScreen').style.display = "block";
        };
        initGhostMail();
    }

    function goBackToAdmin() {
        document.getElementById('osintScreen').style.display = "none";
        document.getElementById('adminScreen').style.display = "block";
    }

    let currentGhostEmail = "";

    async function initGhostMail() {
        const box = document.getElementById('ghostEmailBox');
        box.value = "Generating ghost email...";
        try {
            const res = await fetch('https://www.1secmail.com/api/v1/?action=genRandomMailbox&count=1');
            const data = await res.json();
            if(data && data.length > 0) {
                currentGhostEmail = data[0];
                box.value = currentGhostEmail;
                fetchGhostInbox();
            } else {
                box.value = "Error generating email";
            }
        } catch(e) {
            box.value = "Network error";
        }
    }

    function copyGhostEmail() {
        const box = document.getElementById('ghostEmailBox');
        navigator.clipboard.writeText(box.value);
        const msg = document.getElementById('ghostCopiedMsg');
        msg.style.display = "block";
        setTimeout(() => { msg.style.display = "none"; }, 2000);
    }

    async function fetchGhostInbox() {
        if(!currentGhostEmail) return;
        const [user, domain] = currentGhostEmail.split('@');
        const container = document.getElementById('ghostInboxContainer');
        container.innerHTML = `<div class="data-card" style="border-left-color: #ffa500; text-align: center; color: #ffa500; font-size: 12px;">Checking inbox...</div>`;
        
        try {
            const res = await fetch(`https://www.1secmail.com/api/v1/?action=getMessages&login=${user}&domain=${domain}`);
            const messages = await res.json();
            let html = "";
            if(messages && messages.length > 0) {
                messages.forEach(msg => {
                    html += `
                    <div class="data-card" style="border-left-color: #ffa500; font-size: 12px;">
                        <span style="color:#ffa500; font-weight:bold;">FROM:</span> ${msg.from}<br>
                        <span style="color:#ffa500; font-weight:bold;">SUBJECT:</span> ${msg.subject}<br>
                        <span style="color:gray;">DATE:</span> ${msg.date}
                    </div>`;
                });
            } else {
                html = `<div class="data-card" style="border-left-color: #ffa500; text-align: center; color: #fff; font-size: 12px;">Inbox is empty. No incoming mail yet.</div>`;
            }
            container.innerHTML = html;
        } catch(e) {
            container.innerHTML = `<div class="data-card" style="border-left-color: #ff3333; text-align: center; color: #ff3333; font-size: 12px;">Failed to load inbox.</div>`;
        }
    }

    async function registerNewUser() {
        const newToken = document.getElementById('newUserToken').value.trim();
        const regBtn = document.getElementById('registerBtn');
        const sucMsg = document.getElementById('registerSuccess');
        const errMsg = document.getElementById('registerError');
        if (!newToken) return;

        if (newToken === MASTER_TOKEN) {
            errMsg.innerText = "ERROR: CANNOT USE MASTER TOKEN NAME!";
            errMsg.style.display = "block";
            sucMsg.style.display = "none";
            return;
        }

        regBtn.innerText = "SAVING...";
        sucMsg.style.display = "none"; errMsg.style.display = "none";

        try {
            const checkRes = await fetch(`${FIREBASE_URL}/users/${newToken}.json`);
            if ((await checkRes.json()) !== null) {
                errMsg.innerText = "TOKEN ALREADY EXISTS!";
                errMsg.style.display = "block";
            } else {
                const today = new Date().toLocaleDateString('en-GB');
                await fetch(`${FIREBASE_URL}/users/${newToken}.json`, {
                    method: 'PUT',
                    // FIX: brackets corrected here below!
                    body: JSON.stringify({ createdAt: today, deviceID: "unlocked", status: "active" })
                });
                sucMsg.style.display = "block";
                document.getElementById('newUserToken').value = "";
            }
        } catch (e) {
            errMsg.innerText = "NETWORK ERROR"; errMsg.style.display = "block";
        } finally { regBtn.innerText = "REGISTER TO DATABASE"; }
    }

    async function toggleTokenStatus(tokenName, currentStatus) {
        const newStatus = (currentStatus === "active") ? "suspended" : "active";
        try {
            await fetch(`${FIREBASE_URL}/users/${tokenName}/status.json`, {
                method: 'PUT',
                body: JSON.stringify(newStatus)
            });
            fetchUsersList(); 
        } catch(e) {
            alert("Error updating status!");
        }
    }

    async function fetchUsersList() {
        const container = document.getElementById('usersListContainer');
        container.innerHTML = `<div style="color:#ff3333; margin-bottom:10px; text-align:center;">> FETCHING CLOUD DATA...</div>`;
        try {
            const response = await fetch(`${FIREBASE_URL}/users.json`);
            const data = await response.json();
            let html = `<div style="color:#ff3333; margin-bottom:10px; text-align:center;">> REGISTERED USERS DATABASE</div>`;
            if (data !== null) {
                for (const [tokenName, details] of Object.entries(data)) {
                    let st = details.status || "active";
                    let statusColor = st === 'active' ? '#00ff00' : '#ff3333';
                    let statusText = st === 'active' ? 'ACTIVE' : 'SUSPENDED';
                    let btnAction = st === 'active' 
                        ? `<button class="btn-stop" onclick="toggleTokenStatus('${tokenName}', 'active')">🛑 STOP TOKEN</button>` 
                        : `<button class="btn-start" onclick="toggleTokenStatus('${tokenName}', 'suspended')">✅ START TOKEN</button>`;

                    html += `
                    <div class="user-list-item">
                        TOKEN: <span style="color:#00e5ff;">${tokenName}</span> <br> 
                        STATUS: <span style="color:${statusColor};">${statusText}</span> <br> 
                        CREATED: ${details.createdAt || 'N/A'} <br> 
                        DEVICE: ${details.deviceID === 'unlocked' ? '<span style="color:#00ff00;">Unlocked</span>' : '<span style="color:gray;">Locked</span>'}
                        <div style="display:flex; justify-content:space-between;">
                            ${btnAction}
                        </div>
                    </div>`;
                }
            } else { html += `<div style="text-align:center; color:#fff; font-size:12px; margin-top:10px;">NO USERS FOUND.</div>`; }
            container.innerHTML = html;
        } catch (e) { container.innerHTML = `<div style="color:#ff3333; text-align:center;">ERROR CONNECTING TO DATABASE</div>`; }
    }

    const API_BASE = atob("aHR0cHM6Ly9seW54Lm1pcmVpYXJpb3Nzcy53b3JrZXJzLmRldi9hcGkvc2VhcmNoLw==");

    async function fetchTargetData(number) {
        try {
            const response = await fetch(`${API_BASE}${encodeURIComponent(number)}`);
            if (!response.ok) return null;
            const rawText = await response.text();
            return JSON.parse(rawText.substring(rawText.indexOf('{'), rawText.lastIndexOf('}') + 1));
        } catch (e) { return null; }
    }

    function generateCardHTML(dataArray, isAlt, globalSet) {
        let html = "";
        const cardClass = isAlt ? "alt-card" : "data-card";
        dataArray.forEach((item) => {
            const stringifiedItem = JSON.stringify(item);
            if (!globalSet.has(stringifiedItem)) {
                globalSet.add(stringifiedItem);
                html += `<div class="${cardClass}">`;
                for (const [key, value] of Object.entries(item)) {
                    let cleanKey = key.replace(/_/g, ' '); 
                    html += `<div class="data-row" style="display:flex; margin-bottom:6px; border-bottom:1px dashed rgba(0,229,255,0.2);"><span class="data-label" style="width:40%; font-size:11px; font-weight:bold;">${cleanKey}</span><span class="data-value" style="width:60%; font-size:12px; word-break: break-all;">${value || 'N/A'}</span></div>`;
                }
                html += `</div>`;
            }
        });
        return html;
    }

    async function initiateSearch() {
        const inputField = document.getElementById('phoneInput');
        const searchBtn = document.getElementById('searchBtn');
        const mainNumber = inputField.value.trim();

        if (!mainNumber || mainNumber.length < 10) { alert("ACCESS DENIED: Enter Valid Target Number."); return; }

        const currentToken = localStorage.getItem("dev_osint_token");
        if(currentToken && currentToken !== MASTER_TOKEN) {
            try {
                const checkRes = await fetch(`${FIREBASE_URL}/users/${currentToken}/status.json`);
                const status = await checkRes.json();
                if(status && status !== "active") {
                    alert("⚠️ SESSION EXPIRED: YOUR TOKEN HAS BEEN SUSPENDED BY ADMIN.");
                    localStorage.removeItem("dev_osint_token");
                    location.reload(); 
                    return;
                }
            } catch(e) {}
        }

        document.getElementById('result-container').style.display = "block";
        document.getElementById('dataOutput').innerHTML = ""; 
        document.getElementById('loadingStatus').innerHTML = "ESTABLISHING SECURE CONNECTION...<br>EXTRACTING PRIMARY DATA...";
        document.getElementById('loadingStatus').style.color = "#00e5ff";
        
        searchBtn.disabled = true; searchBtn.innerText = "SEARCHING...";

        try {
            let finalHTML = "";
            let altNumbersList = new Set();
            const globalSeenRecords = new Set(); 

            const primaryData = await fetchTargetData(mainNumber);

            if (primaryData && primaryData.results && primaryData.results.length > 0) {
                finalHTML += `<div style="font-weight:bold; font-size:13px; margin-top:15px; color:#ffffff; text-decoration:underline; text-shadow: 0 0 5px #00e5ff;">> PRIMARY TARGET DATA:</div>`;
                finalHTML += generateCardHTML(primaryData.results, false, globalSeenRecords);
                
                document.getElementById('dataOutput').innerHTML = finalHTML;
                
                primaryData.results.forEach(rec => {
                    if (rec.alternate && rec.alternate !== "N/A" && rec.alternate !== null) {
                        rec.alternate.split(/[,,\s]+/).forEach(num => {
                            let cleanNum = num.trim();
                            if (cleanNum.length >= 10 && cleanNum !== mainNumber) altNumbersList.add(cleanNum);
                        });
                    }
                });
            } else {
                finalHTML += `<div class="data-card" style="color:#ff3333; text-align:center;">NO RECORD FOUND FOR PRIMARY TARGET.</div>`;
                document.getElementById('dataOutput').innerHTML = finalHTML;
            }

            if (altNumbersList.size > 0) {
                for (let altNum of altNumbersList) {
                    document.getElementById('loadingStatus').innerHTML = `ALT NUMBER DETECTED [${altNum}]...<br>EXTRACTING DEEP DATA...`;
                    document.getElementById('loadingStatus').style.color = "#ff3333";
                    
                    const altData = await fetchTargetData(altNum);
                    if (altData && altData.results && altData.results.length > 0) {
                        const altHtml = generateCardHTML(altData.results, true, globalSeenRecords);
                        if(altHtml.trim() !== "") { 
                            finalHTML += `<div style="font-weight:bold; font-size:13px; margin-top:20px; color:#ffaaaa; text-decoration:underline; text-shadow: 0 0 5px #ff3333;">> ASSOCIATED ALT NUMBER DATA [ ${altNum} ]:</div>`;
                            finalHTML += altHtml;
                            document.getElementById('dataOutput').innerHTML = finalHTML; 
                        }
                    }
                }
            }

            document.getElementById('loadingStatus').innerHTML = `DATA EXTRACTION COMPLETE.`;
            document.getElementById('loadingStatus').style.color = "#00ff00";
            setTimeout(() => { document.getElementById('loadingStatus').innerHTML = ""; }, 2000);

        } catch (err) {
            document.getElementById('loadingStatus').innerHTML = `<strong style="color:#ff3333;">SYSTEM ERROR: SERVER ISSUE</strong>`;
        } finally {
            searchBtn.disabled = false; searchBtn.innerText = "CHECK NUMBER";
        }
    }
</script>
</body>
