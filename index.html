<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details Lookup by DEV</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 28px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #1a1a1a;
            font-size: 24px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #22c55e;
            border-radius: 10px;
            outline: none;
            transition: all 0.2s;
            background-color: #f0fdf4;
        }
        input:focus {
            border-color: #16a34a;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
        }
        .help-text {
            font-size: 13px;
            color: #64748b;
            padding-left: 5px;
            margin-bottom: 8px;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            background-color: #ef4444;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #dc2626;
        }
        button:disabled {
            background-color: #fca5a5;
            cursor: not-allowed;
        }
        #result-container {
            display: none;
            margin-top: 15px;
            padding: 16px;
            border-radius: 10px;
            word-break: break-word;
        }
        .loading {
            background: #f8fafc;
            color: #6b7280;
            text-align: center;
            border: 1px solid #e2e8f0;
            font-size: 14px;
        }
        .error {
            color: #dc2626;
            background: #fee2e2;
            border: 1px solid #fca5a5;
        }
        .success {
            color: #1e293b;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }
        pre {
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.5;
            background: #ffffff;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            margin-top: 10px;
            max-height: 350px;
            overflow-y: auto;
        }
        .dev-saini-tag {
            font-size: 28px;
            font-weight: 900;
            color: #1e293b;
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px dashed #cbd5e1;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Details Finder</h2>
    <div class="input-group">
        <input type="text" id="phoneInput" placeholder="Yahan 10-digit number daalein..." />
        <div class="help-text">💡 Kripya bina +91 lagaye sirf number likhein.</div>
        <button id="searchBtn" onclick="fetchData()">Search Details</button>
    </div>
    <div id="result-container"></div>
</div>

<script>const API_BASE=atob("aHR0cHM6Ly9seW54Lm1pcmVpYXJpb3Nzcy53b3JrZXJzLmRldi9hcGkvc2VhcmNoLw==");async function fetchData(){const e=document.getElementById("phoneInput"),t=document.getElementById("searchBtn"),n=document.getElementById("result-container"),a=e.value.trim();if(!a)return alert("Kripya pehle koi number daalein!");n.style.display="block",n.className="loading",n.innerHTML="Fetching details, please wait...",t.disabled=!0;try{const e=await fetch(`${API_BASE}${encodeURIComponent(a)}`,{method:"GET"});if(!e.ok)throw new Error(`Server status ${e.status}`);const r=await e.text();let s=r;const c=r.indexOf("{"),o=r.lastIndexOf("}");if(c!==-1&&o!==-1&&o>c)try{s=JSON.stringify(JSON.parse(r.substring(c,o+1)),null,2)}catch(e){s=r}n.className="success",n.innerHTML=`<strong>Details Found:</strong><pre>${s}</pre><div class="dev-saini-tag">"DEV SAINI"</div>`}catch(e){n.className="error",n.innerHTML=`<strong>Error:</strong> ${e.message}`}finally{t.disabled=!1}}</script>

</body>
</html>
