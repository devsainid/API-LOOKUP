<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEV OSINT TERMINAL</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Courier New", Courier, monospace; 
        }

        body {
            background-color: #050505;
            background-image: 
                linear-gradient(rgba(0, 255, 0, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.15) 1px, transparent 1px);
            background-size: 25px 25px;
            color: #00ff00;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: rgba(0, 15, 0, 0.9);
            width: 100%;
            max-width: 480px;
            padding: 30px 20px;
            border-radius: 5px;
            border: 1px solid #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2), inset 0 0 15px rgba(0, 255, 0, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
            color: #00ff00;
            text-shadow: 0 0 8px #00ff00;
            letter-spacing: 2px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            background: #000;
            border: 1px solid #00ff00;
            color: #00ff00;
            outline: none;
            font-weight: bold;
            text-align: center;
        }

        input:focus {
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.4);
            background: #051a05;
        }

        input::placeholder {
            color: rgba(0, 255, 0, 0.4);
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            background: #00ff00;
            color: #000;
            font-weight: bold;
            border: none;
            cursor: pointer;
            letter-spacing: 1.5px;
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        #result-container {
            display: none;
            margin-top: 25px;
        }

        .data-card {
            background: rgba(0, 30, 0, 0.8);
            border-left: 4px solid #00ff00;
            padding: 15px;
            margin-top: 15px;
            border-top: 1px solid rgba(0, 255, 0, 0.2);
            border-right: 1px solid rgba(0, 255, 0, 0.2);
            border-bottom: 1px solid rgba(0, 255, 0, 0.2);
        }

        .data-row {
            display: flex;
            margin-bottom: 10px;
            border-bottom: 1px dashed rgba(0, 255, 0, 0.3);
            padding-bottom: 6px;
        }

        .data-label {
            color: #00ff00;
            width: 35%;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 13px;
        }

        .data-value {
            color: #ffffff;
            width: 65%;
            font-size: 14px;
            word-break: break-word;
            text-shadow: 0 0 3px rgba(255,255,255,0.4);
        }

        /* Naya VIP Footer Font aur Style */
        .dev-saini-tag {
            font-size: 14px;
            font-weight: 900;
            text-align: center;
            margin-top: 30px;
            padding-top: 15px;
            color: #ffffff;
            border-top: 1px dashed rgba(0, 255, 0, 0.4);
            letter-spacing: 1px;
            text-shadow: 0 0 5px #00ff00, 0 0 15px #00ff00;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.98); }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>[ DEV SAINI'S DATABASE ]</h2>
    <div class="input-group">
        <input type="text" id="phoneInput" placeholder="TARGET NUMBER (10 DIGITS)..." />
        <button id="searchBtn" onclick="fetchData()">CHECK NUMBER</button>
    </div>
    <div id="result-container"></div>
</div>

<script>
// Tera Safe API Link
const API_BASE = atob("aHR0cHM6Ly9seW54Lm1pcmVpYXJpb3Nzcy53b3JrZXJzLmRldi9hcGkvc2VhcmNoLw==");

async function fetchData() {
    const inputField = document.getElementById('phoneInput');
    const searchBtn = document.getElementById('searchBtn');
    const resultContainer = document.getElementById('result-container');
    const queryVal = inputField.value.trim();

    if (!queryVal) {
        alert("ACCESS DENIED: Enter Target Number.");
        return;
    }

    resultContainer.style.display = "block";
    resultContainer.innerHTML = "<div style='text-align:center; color:#00ff00;'>FETCHING TARGET DATA...</div>";
    searchBtn.disabled = true;
    searchBtn.style.background = "#005500";
    searchBtn.innerText = "SEARCHING...";

    try {
        const targetUrl = `${API_BASE}${encodeURIComponent(queryVal)}`;
        const response = await fetch(targetUrl, { method: "GET" });

        if (!response.ok) throw new Error(`Server status ${response.status}`);

        const rawText = await response.text();
        let finalHTML = "";
        
        try {
            const firstBrace = rawText.indexOf('{');
            const lastBrace = rawText.lastIndexOf('}');
            const jsonString = rawText.substring(firstBrace, lastBrace + 1);
            const parsed = JSON.parse(jsonString);

            if (parsed.results && Array.isArray(parsed.results) && parsed.results.length > 0) {
                
                // DUPLICATE REMOVER LOGIC (Ek hi entry 2 baar aane se rokega)
                const uniqueData = [];
                const checkDuplicate = new Set();
                
                parsed.results.forEach(item => {
                    // Object ko string banakar check karna ki pehle aa chuka hai ya nahi
                    const stringifiedItem = JSON.stringify(item);
                    if (!checkDuplicate.has(stringifiedItem)) {
                        checkDuplicate.add(stringifiedItem);
                        uniqueData.push(item);
                    }
                });

                uniqueData.forEach((item) => {
                    finalHTML += `<div class="data-card">`;
                    for (const [key, value] of Object.entries(item)) {
                        let cleanKey = key.replace(/_/g, ' '); 
                        finalHTML += `
                        <div class="data-row">
                            <span class="data-label">${cleanKey}</span>
                            <span class="data-value">${value || 'N/A'}</span>
                        </div>`;
                    }
                    finalHTML += `</div>`;
                });
            } else {
                finalHTML = `<div class="data-card" style="color:red;">NO RECORD FOUND FOR THIS TARGET.</div>`;
            }
        } catch (e) {
            finalHTML = `<div class="data-card"><p>RAW DATA:</p><pre>${rawText}</pre></div>`;
        }

        resultContainer.innerHTML = `
            <div style="font-weight:bold; font-size:16px; margin-top:10px; text-decoration:underline;">> DATA_MATCH_FOUND:</div>
            ${finalHTML}
            <div class="dev-saini-tag">DATA SUCCESSFULLY FETCHED BY DEV SAINI</div>
        `;
    } catch (err) {
        resultContainer.innerHTML = `<div style="color:red; margin-top:10px;"><strong>SYSTEM ERROR:</strong> ${err.message}</div>`;
    } finally {
        searchBtn.disabled = false;
        searchBtn.style.background = "#00ff00";
        searchBtn.innerText = "CHECK NUMBER";
    }
}
</script>

</body>
</html>
