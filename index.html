<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEV OSINT TERMINAL</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Courier New", Courier, monospace; 
        }

        body {
            background-color: #020a14;
            background-image: 
                linear-gradient(rgba(0, 229, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.08) 1px, transparent 1px);
            background-size: 25px 25px;
            color: #00e5ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: rgba(0, 15, 35, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            width: 100%;
            max-width: 480px;
            padding: 30px 20px;
            border-radius: 8px;
            border: 1px solid rgba(0, 229, 255, 0.4);
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.15), inset 0 0 15px rgba(0, 229, 255, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 22px;
            color: #00e5ff;
            text-shadow: 0 0 10px #00e5ff, 0 0 20px rgba(0, 229, 255, 0.5);
            letter-spacing: 2px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 229, 255, 0.5);
            color: #00e5ff;
            outline: none;
            font-weight: bold;
            text-align: center;
            border-radius: 5px;
            transition: 0.3s;
        }

        input:focus {
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            background: rgba(0, 20, 45, 0.8);
            border: 1px solid #00e5ff;
        }

        input::placeholder {
            color: rgba(0, 229, 255, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            background: rgba(0, 229, 255, 0.15);
            color: #00e5ff;
            border: 1px solid #00e5ff;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1.5px;
            transition: 0.3s;
            border-radius: 5px;
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.8);
            box-shadow: inset 0 0 10px rgba(0, 229, 255, 0.2);
        }

        button:active {
            transform: scale(0.96);
            background: #00e5ff;
            color: #000;
        }

        #result-container {
            display: none;
            margin-top: 25px;
        }

        /* PRIMARY TARGET CARD (Blue) */
        .data-card {
            background: rgba(0, 25, 50, 0.3);
            border-left: 3px solid #00e5ff;
            padding: 15px;
            margin-top: 15px;
            border-top: 1px solid rgba(0, 229, 255, 0.1);
            border-right: 1px solid rgba(0, 229, 255, 0.1);
            border-bottom: 1px solid rgba(0, 229, 255, 0.1);
            border-radius: 5px;
        }

        /* ALT TARGET CARD (Orange/Red) */
        .alt-card {
            background: rgba(40, 10, 0, 0.3);
            border-left: 3px solid #ff3333;
            padding: 15px;
            margin-top: 15px;
            border-top: 1px solid rgba(255, 51, 51, 0.1);
            border-right: 1px solid rgba(255, 51, 51, 0.1);
            border-bottom: 1px solid rgba(255, 51, 51, 0.1);
            border-radius: 5px;
        }

        .data-row {
            display: flex;
            margin-bottom: 10px;
            padding-bottom: 6px;
            position: relative;
            overflow: hidden; 
        }

        /* Blue Line for Primary */
        .data-card .data-row::before {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%;
            border-bottom: 1px dashed rgba(0, 229, 255, 0.25);
        }
        /* Red Line for ALT */
        .alt-card .data-row::before {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%;
            border-bottom: 1px dashed rgba(255, 51, 51, 0.25);
        }

        /* Blue Scan for Primary */
        .data-card .data-row::after {
            content: ''; position: absolute; bottom: -1px; left: -50%; width: 40%; height: 2px;
            background: linear-gradient(90deg, transparent, #00e5ff, #ffffff, transparent);
            animation: cyberScan 2.5s infinite linear;
        }
        /* Red Scan for ALT */
        .alt-card .data-row::after {
            content: ''; position: absolute; bottom: -1px; left: -50%; width: 40%; height: 2px;
            background: linear-gradient(90deg, transparent, #ff3333, #ffffff, transparent);
            animation: cyberScan 2.5s infinite linear;
        }

        @keyframes cyberScan {
            0% { left: -50%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }

        .data-label {
            color: #00e5ff; width: 35%; font-weight: bold; text-transform: uppercase; font-size: 13px; text-shadow: 0 0 2px rgba(0, 229, 255, 0.4);
        }
        .alt-card .data-label {
            color: #ff5555; text-shadow: 0 0 2px rgba(255, 51, 51, 0.4);
        }

        .data-value {
            color: #ffffff; width: 65%; font-size: 14px; word-break: break-word; text-shadow: 0 0 3px rgba(255,255,255,0.5);
        }

        .section-title {
            font-weight:bold; font-size:14px; margin-top:20px; color:#ffffff; text-decoration:underline;
        }
        .primary-title { text-shadow: 0 0 5px #00e5ff; }
        .alt-title { text-shadow: 0 0 5px #ff3333; color: #ffaaaa; margin-top: 25px;}

        .dev-saini-tag {
            font-size: 12px; font-weight: 900; text-align: center; margin-top: 30px; padding-top: 15px; color: #ffffff;
            border-top: 1px dashed rgba(0, 229, 255, 0.4); letter-spacing: 1px;
            text-shadow: 0 0 5px #00e5ff, 0 0 12px #00e5ff; animation: textPulse 2s infinite;
        }

        @keyframes textPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.75; transform: scale(0.99); }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>[ DEV SAINI'S DATABASE ]</h2>
    <div class="input-group">
        <input type="text" id="phoneInput" placeholder="TARGET NUMBER (10 DIGITS)..." autocomplete="off" />
        <button id="searchBtn" onclick="initiateSearch()">CHECK NUMBER</button>
    </div>
    <div id="result-container"></div>
</div>

<script>
// Tera API Link yahan daal lena (Abhi placeholder hai)
const API_BASE = "https://api.example.com/search/"; 

// Data nikalne ka main function
async function fetchTargetData(number) {
    try {
        const response = await fetch(`${API_BASE}${encodeURIComponent(number)}`);
        if (!response.ok) return null;
        const rawText = await response.text();
        const firstBrace = rawText.indexOf('{');
        const lastBrace = rawText.lastIndexOf('}');
        const jsonString = rawText.substring(firstBrace, lastBrace + 1);
        return JSON.parse(jsonString);
    } catch (e) {
        return null;
    }
}

// Data ko card me badalne ka function
function generateCardHTML(dataArray, isAlt = false) {
    let html = "";
    const cardClass = isAlt ? "alt-card" : "data-card";
    
    // Duplicate remover
    const uniqueData = [];
    const checkDuplicate = new Set();
    
    dataArray.forEach(item => {
        const stringifiedItem = JSON.stringify(item);
        if (!checkDuplicate.has(stringifiedItem)) {
            checkDuplicate.add(stringifiedItem);
            uniqueData.push(item);
        }
    });

    uniqueData.forEach((item) => {
        html += `<div class="${cardClass}">`;
        for (const [key, value] of Object.entries(item)) {
            let cleanKey = key.replace(/_/g, ' '); 
            html += `
            <div class="data-row">
                <span class="data-label">${cleanKey}</span>
                <span class="data-value">${value || 'N/A'}</span>
            </div>`;
        }
        html += `</div>`;
    });
    return html;
}

async function initiateSearch() {
    const inputField = document.getElementById('phoneInput');
    const searchBtn = document.getElementById('searchBtn');
    const resultContainer = document.getElementById('result-container');
    const mainNumber = inputField.value.trim();

    if (!mainNumber || mainNumber.length < 10) {
        alert("ACCESS DENIED: Enter Valid Target Number.");
        return;
    }

    resultContainer.style.display = "block";
    resultContainer.innerHTML = "<div style='text-align:center; color:#00e5ff; font-weight:bold;'>ESTABLISHING SECURE CONNECTION...<br>EXTRACTING PRIMARY DATA...</div>";
    searchBtn.disabled = true;
    searchBtn.style.background = "rgba(0, 100, 150, 0.3)";
    searchBtn.innerText = "SEARCHING...";

    try {
        let finalHTML = "";
        let altNumberFound = null;

        // STEP 1: Main Number ki detail nikalo
        const primaryData = await fetchTargetData(mainNumber);

        if (primaryData && primaryData.results && primaryData.results.length > 0) {
            finalHTML += `<div class="section-title primary-title">> PRIMARY TARGET DATA:</div>`;
            finalHTML += generateCardHTML(primaryData.results, false);
            
            // Chupchaap check karo ki kya koi alternate number hai
            let possibleAlt = primaryData.results[0].alternate;
            if (possibleAlt && possibleAlt !== "N/A" && possibleAlt !== null) {
                // Agar number ke beech me comma ho, toh pehla nikal lo
                altNumberFound = possibleAlt.split(',')[0].trim();
            }
        } else {
            finalHTML += `<div class="data-card" style="color:#ff3333;">NO RECORD FOUND FOR PRIMARY TARGET.</div>`;
        }

        // STEP 2: Agar Alternate Number mila, toh uski bhi detail nikalo!
        if (altNumberFound && altNumberFound.length >= 10) {
            resultContainer.innerHTML = `<div style='text-align:center; color:#ff3333; font-weight:bold;'>ALT NUMBER DETECTED [${altNumberFound}]...<br>EXTRACTING DEEP DATA...</div>`;
            
            const altData = await fetchTargetData(altNumberFound);
            
            if (altData && altData.results && altData.results.length > 0) {
                finalHTML += `<div class="section-title alt-title">> ASSOCIATED ALT NUMBER DATA [ ${altNumberFound} ]:</div>`;
                finalHTML += generateCardHTML(altData.results, true);
            }
        }

        resultContainer.innerHTML = `
            ${finalHTML}
            <div class="dev-saini-tag">DATA SUCCESSFULLY FETCHED FROM DEV SAINI'S DATABASE</div>
        `;
    } catch (err) {
        resultContainer.innerHTML = `<div style="color:#ff3333; margin-top:10px; text-align:center;"><strong>SYSTEM ERROR:</strong> ${err.message}</div>`;
    } finally {
        searchBtn.disabled = false;
        searchBtn.style.background = "rgba(0, 229, 255, 0.15)";
        searchBtn.innerText = "CHECK NUMBER";
    }
}
</script>

</body>
</html>
