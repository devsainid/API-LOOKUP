<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEV OSINT TERMINAL</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Courier New", Courier, monospace; 
        }

        body {
            background-color: #020a14;
            background-image: 
                linear-gradient(rgba(0, 229, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.08) 1px, transparent 1px);
            background-size: 25px 25px;
            color: #00e5ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Transparent Blue Neon Card */
        .card {
            background: rgba(0, 15, 35, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            width: 100%;
            max-width: 480px;
            padding: 30px 20px;
            border-radius: 8px;
            border: 1px solid rgba(0, 229, 255, 0.4);
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.15), inset 0 0 15px rgba(0, 229, 255, 0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 22px;
            color: #00e5ff;
            text-shadow: 0 0 10px #00e5ff, 0 0 20px rgba(0, 229, 255, 0.5);
            letter-spacing: 2px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 229, 255, 0.5);
            color: #00e5ff;
            outline: none;
            font-weight: bold;
            text-align: center;
            border-radius: 5px;
            transition: 0.3s;
        }

        input:focus {
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            background: rgba(0, 20, 45, 0.8);
            border: 1px solid #00e5ff;
        }

        input::placeholder {
            color: rgba(0, 229, 255, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            background: rgba(0, 229, 255, 0.15);
            color: #00e5ff;
            border: 1px solid #00e5ff;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1.5px;
            transition: 0.3s;
            border-radius: 5px;
            text-shadow: 0 0 5px rgba(0, 229, 255, 0.8);
            box-shadow: inset 0 0 10px rgba(0, 229, 255, 0.2);
        }

        button:active {
            transform: scale(0.96);
            background: #00e5ff;
            color: #000;
        }

        #result-container {
            display: none;
            margin-top: 25px;
        }

        .data-card {
            background: rgba(0, 25, 50, 0.3);
            border-left: 3px solid #00e5ff;
            padding: 15px;
            margin-top: 15px;
            border-top: 1px solid rgba(0, 229, 255, 0.1);
            border-right: 1px solid rgba(0, 229, 255, 0.1);
            border-bottom: 1px solid rgba(0, 229, 255, 0.1);
            border-radius: 5px;
        }

        /* Lighting Animation */
        .data-row {
            display: flex;
            margin-bottom: 10px;
            padding-bottom: 6px;
            position: relative;
            overflow: hidden; 
        }

        .data-row::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            border-bottom: 1px dashed rgba(0, 229, 255, 0.25);
        }

        .data-row::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: -50%;
            width: 40%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00e5ff, #ffffff, transparent);
            animation: cyberScan 2.5s infinite linear;
        }

        @keyframes cyberScan {
            0% { left: -50%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }

        .data-label {
            color: #00e5ff;
            width: 35%;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 13px;
            text-shadow: 0 0 2px rgba(0, 229, 255, 0.4);
        }

        .data-value {
            color: #ffffff;
            width: 65%;
            font-size: 14px;
            word-break: break-word;
            text-shadow: 0 0 3px rgba(255,255,255,0.5);
        }

        /* VIP Footer Tag */
        .dev-saini-tag {
            font-size: 12px;
            font-weight: 900;
            text-align: center;
            margin-top: 30px;
            padding-top: 15px;
            color: #ffffff;
            border-top: 1px dashed rgba(0, 229, 255, 0.4);
            letter-spacing: 1px;
            text-shadow: 0 0 5px #00e5ff, 0 0 12px #00e5ff;
            animation: textPulse 2s infinite;
        }

        @keyframes textPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.75; transform: scale(0.99); }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>[ DEV SAINI'S DATABASE ]</h2>
    <div class="input-group">
        <input type="text" id="phoneInput" placeholder="TARGET NUMBER (10 DIGITS)..." autocomplete="off" />
        <button id="searchBtn" onclick="fetchData()">CHECK NUMBER</button>
    </div>
    <div id="result-container"></div>
</div>

<script>
// Sirf 1st Fast API
const API_BASE = atob("aHR0cHM6Ly9seW54Lm1pcmVpYXJpb3Nzcy53b3JrZXJzLmRldi9hcGkvc2VhcmNoLw==");

async function fetchData() {
    const inputField = document.getElementById('phoneInput');
    const searchBtn = document.getElementById('searchBtn');
    const resultContainer = document.getElementById('result-container');
    const queryVal = inputField.value.trim();

    if (!queryVal || queryVal.length < 10) {
        alert("ACCESS DENIED: Enter Valid 10-Digit Target Number.");
        return;
    }

    resultContainer.style.display = "block";
    resultContainer.innerHTML = "<div style='text-align:center; color:#00e5ff; font-weight:bold;'>ESTABLISHING SECURE CONNECTION...</div>";
    searchBtn.disabled = true;
    searchBtn.style.background = "rgba(0, 100, 150, 0.3)";
    searchBtn.style.color = "#00e5ff";
    searchBtn.innerText = "SEARCHING...";

    try {
        const targetUrl = `${API_BASE}${encodeURIComponent(queryVal)}`;
        const response = await fetch(targetUrl, { method: "GET" });

        if (!response.ok) throw new Error(`Server status ${response.status}`);

        const rawText = await response.text();
        let finalHTML = "";
        
        try {
            const firstBrace = rawText.indexOf('{');
            const lastBrace = rawText.lastIndexOf('}');
            const jsonString = rawText.substring(firstBrace, lastBrace + 1);
            const parsed = JSON.parse(jsonString);

            if (parsed.results && Array.isArray(parsed.results) && parsed.results.length > 0) {
                
                // Smart Duplicate Remover
                const uniqueData = [];
                const checkDuplicate = new Set();
                
                parsed.results.forEach(item => {
                    const stringifiedItem = JSON.stringify(item);
                    if (!checkDuplicate.has(stringifiedItem)) {
                        checkDuplicate.add(stringifiedItem);
                        uniqueData.push(item);
                    }
                });

                uniqueData.forEach((item) => {
                    finalHTML += `<div class="data-card">`;
                    for (const [key, value] of Object.entries(item)) {
                        let cleanKey = key.replace(/_/g, ' '); 
                        finalHTML += `
                        <div class="data-row">
                            <span class="data-label">${cleanKey}</span>
                            <span class="data-value">${value || 'N/A'}</span>
                        </div>`;
                    }
                    finalHTML += `</div>`;
                });
            } else {
                finalHTML = `<div class="data-card" style="color:#ff3333; border-left-color:#ff3333; text-align:center;">NO RECORD FOUND FOR THIS TARGET.</div>`;
            }
        } catch (e) {
            finalHTML = `<div class="data-card"><p>RAW DATA:</p><pre>${rawText}</pre></div>`;
        }

        resultContainer.innerHTML = `
            <div style="font-weight:bold; font-size:15px; margin-top:10px; color:#ffffff; text-decoration:underline; text-shadow: 0 0 5px #00e5ff;">> DATA_MATCH_FOUND:</div>
            ${finalHTML}
            <div class="dev-saini-tag">DATA SUCCESSFULLY FETCHED FROM DEV SAINI'S DATABASE</div>
        `;
    } catch (err) {
        resultContainer.innerHTML = `<div style="color:#ff3333; margin-top:10px; text-align:center;"><strong>SYSTEM ERROR:</strong> ${err.message}</div>`;
    } finally {
        searchBtn.disabled = false;
        searchBtn.style.background = "rgba(0, 229, 255, 0.15)";
        searchBtn.innerText = "CHECK NUMBER";
    }
}
</script>

</body>
</html>
